<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luke Jackson - Gallery</title>
    <link href="gallery.css" rel="stylesheet" type="text/css" media="all">
</head>
<body>
    <div class="wrapper">
        <header>
            <div class="banner">
                <h1>Luke Jackson</h1>
            </div>
        </header>

        <nav aria-label="Primary Navigation">
            <ul class="primary-navigation">
                <li class="nav"><a href="music.html">Music</a></li>
                <li class="nav"><a href="gallery.html">Gallery</a></li>
                <li class="nav"><a href="https://linkedin.com/in/lej03/">Contact</a></li>
            </ul>
        </nav>

        <main>
            <div class="gallery-grid">
                <div class="gallery-item" onclick="openLightbox(this)">
                    <img src="images/LukeGuitarChud.webp" alt="Luke Guitar">
                </div>
                <div class="gallery-item" onclick="openLightbox(this)">
                    <img src="images/IDIDTHAT.webp" alt="Pointing Figure">
                </div>
                <!-- Add more images here -->
                <div class="gallery-item" onclick="openLightbox(this)">
                    <img src="images/WiseBlood.webp" alt="Wise Blood">
                </div>
            </div>
        </main>

        <footer>
            <div class="footer-text">
                <p>Copyright © 2025 Luke Jackson all rights reserved</p>
            </div>
            <div class="footer-links">
                <a class="links" href="https://github.com/Luke-E-Jackson" target="_blank">github.com/Luke-E-Jackson</a>
                <a class="links" href="https://linkedin.com/in/lej03/" target="_blank">linkedin.com/in/lej03/</a>
            </div>
        </footer>
    </div>

    <!-- Lightbox Modal -->
    <div id="lightbox" class="lightbox" onclick="closeLightbox()">
        <img id="lightbox-img" src="" alt="Enlarged view">
    </div>

    <script>
        function openLightbox(element) {
            const img = element.querySelector('img');
            const lightbox = document.getElementById('lightbox');
            const lightboxImg = document.getElementById('lightbox-img');
            lightboxImg.src = img.src;
            lightboxImg.alt = img.alt;
            lightbox.classList.add('active');
        }

        function closeLightbox() {
            document.getElementById('lightbox').classList.remove('active');
        }
    </script>
</body>
</html>
